<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Breach: Wallbang Arena</title>
<style>
:root{--ink:#f4e9d8;--panel:rgba(24,16,10,.74);--amber:#f2a03d;--red:#d9452f;--sky:#b9d3e6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#f4e9d8;--panel:rgba(24,16,10,.74)}}
:root[data-theme="dark"]{--ink:#f4e9d8}
html,body{height:100%;margin:0;background:var(--sky);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",sans-serif;overflow:hidden}
canvas{display:block;width:100%;height:100%}
#hud{position:fixed;inset:0;pointer-events:none}
#top{position:absolute;left:50%;top:calc(10px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--panel);padding:6px 14px;border-radius:6px;font-size:15px;text-align:center;line-height:1.4}
#top b{font-size:22px;color:var(--amber)}
#stats{position:absolute;left:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));background:var(--panel);padding:8px 12px;border-radius:6px;font-size:14px;line-height:1.5}
#bar{width:160px;height:8px;background:#0006;margin:4px 0}#hp{height:100%;width:100%;background:var(--amber)}
#cross{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border:1px solid var(--ink);border-radius:50%}
#msg{position:absolute;left:50%;top:62%;transform:translateX(-50%);font-size:20px;font-weight:700;color:var(--amber);text-shadow:0 2px 4px #000;opacity:0;transition:opacity .25s;white-space:nowrap}
#dmg{position:absolute;inset:0;background:radial-gradient(transparent 40%,var(--red));opacity:0;transition:opacity .3s}
#help{position:absolute;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));background:var(--panel);padding:6px 10px;border-radius:6px;font-size:12px;max-width:34vw}
#ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(20,12,8,.9);text-align:center;padding:16px;overflow:auto}
#ov h1{font-size:clamp(28px,6vw,52px);margin:0 0 6px}
#ov p{max-width:560px;line-height:1.5;margin:4px 0;font-size:14px}
#ops{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;max-width:760px;width:100%;margin:12px 0}
#ops button{background:#3a2a1e;color:var(--ink);border:2px solid #5a4430;border-radius:6px;padding:10px;font:inherit;text-align:left;cursor:pointer;position:relative}
#ops button span{display:block;font-size:12px;opacity:.85;margin-top:4px;line-height:1.35}
#ops button.on{border-color:var(--amber);background:#5a3d1c}
#ops button.on::after{content:attr(data-n);position:absolute;right:8px;top:8px;color:var(--amber);font-weight:700}
#go{background:var(--amber);color:#2a1a08;border:0;border-radius:6px;padding:12px 28px;font-weight:700;font-size:16px;font-family:inherit;cursor:pointer}
#go:disabled{opacity:.45;cursor:default}
</style>
</head>

</div>
<div id="ov"></div>

 while(want!==0&&wallAt(me.x+c*want*.45,me.z-s*want*.45,.15)&&Math.abs(want)>.05)want*=.8;if(Math.abs(want)<=.05)want=0;
 me.lean+=(want-me.lean)*(1-Math.exp(-dt*14));
 cam.position.set(me.x+c*me.lean*.45,eye-Math.abs(me.lean)*.08,me.z-s*me.lean*.45);cam.rotation.set(me.pitch,me.yaw,-me.lean*.25);
 me.g.position.set(me.x,0,me.z);
 fT-=dt;const mk2=me.op.id==="marksman",rate=mk2?.5:me.op.id==="shotgun"?.5:.14;
 if(K.Fire&&fT<=0){fT=rate;const o=V(0,0,0),d=V(0,0,0);cam.getWorldPosition(o);cam.getWorldDirection(d);
  const j=me.steady>0?0:.012;d.x+=(Math.random()-.5)*j;d.y+=(Math.random()-.5)*j;fire(me,o,d.normalize(),mk2?62:34,mk2?120:70);beep(120,.12,.12);vmKick=1;vmFlash=.05}}

// ---- round flow ----
function pickUI(msg){sel=[];$("ov").style.display="flex";
 $("ov").innerHTML=`<h1>${msg}</h1><p>Pick 3 operators. The first is the one you play; the next two go to your teammates (the other two squad slots get random operators). Score ${score[0]}–${score[1]}, first to 5 rounds wins. Roles swap every 2 rounds.</p><div id="ops">${OPS.map((o,i)=>`<button id="o${i}" onclick="tog(${i})"><b>${o.n}</b> · ${o.w}<span>${o.d}</span></button>`).join("")}</div><button id="go" onclick="startRound()" disabled>Pick 3</button>`}
function tog(i){const k=sel.indexOf(i);if(k>=0)sel.splice(k,1);else if(sel.length<3)sel.push(i);
 OPS.forEach((_,j)=>{const b=$("o"+j),n=sel.indexOf(j);b.className=n>=0?"on":"";b.dataset.n=n===0?"You":n>0?"Ally "+n:""});
 $("go").disabled=sel.length<3;$("go").textContent=sel.length<3?"Pick "+(3-sel.length)+" more":"Start round"}
function startRound(){picks=sel.slice();round++;$("ov").style.display="none";newRound();try{R.domElement.requestPointerLock()}catch(e){nolock=true}}
function endRound(w,why){state="result";score[w]++;document.exitPointerLock&&document.exitPointerLock();
 $("ov").style.display="flex";$("ov").innerHTML=`<h1>${w===0?"Round won":"Round lost"}</h1><p>${why}</p><p>Score ${score[0]}–${score[1]}</p>`;
 setTimeout(()=>{if(score[w]>=5){$("ov").innerHTML=`<h1>${w===0?"Match won":"Match lost"}</h1><p>Final score ${score[0]}–${score[1]}</p><button id="go" onclick="location.reload()">Play again</button>`}else pickUI("Round "+(round+1))},2800)}
function judge(){const dT=1-atkT,aliveD=units.filter(u=>u.alive&&u.team===dT).length,aliveA=units.filter(u=>u.alive&&u.team===atkT).length;
 if(!aliveD)endRound(atkT===0?0:1,"All defenders were eliminated. Attackers win.");
 else if(!aliveA)endRound(dT===0?0:1,"All attackers were eliminated. Defenders win.");
 else if(timeLeft<=0)endRound(dT===0?0:1,"Time ran out with defenders still alive. Defenders win.")}

// ---- loop ----
let last=performance.now();
function frame(t){const dt=Math.min(.05,(t-last)/1e3);last=t;now+=dt;
 if(state==="live"){
  scene.updateMatrixWorld();
  if(prepT>0){prepT-=dt;if(me.alive){cam.position.set(me.x,1.7,me.z);cam.rotation.set(me.pitch,me.yaw,0)}}
  else{timeLeft-=dt;me.cd=Math.max(0,me.cd-dt);me.steady-=dt;me.brace-=dt;mT-=dt;
   if(me.alive)player(dt);
   for(const u of units)if(u.alive&&!u.isP)bot(u,dt);
   for(let i=0;i<units.length;i++)for(let j=i+1;j<units.length;j++){const a=units[i],b=units[j];if(!a.alive||!b.alive)continue;
    const dx=b.x-a.x,dz=b.z-a.z,d=Math.hypot(dx,dz);if(d<.7&&d>.001){const p=(.7-d)/2;if(!a.isP){a.x-=dx/d*p;a.z-=dz/d*p}if(!b.isP){b.x+=dx/d*p;b.z+=dz/d*p}}}
   if(!me.alive){spec=units.find(u=>u.alive&&u.team===0)||null;if(spec){cam.position.set(spec.x,1.6,spec.z);cam.rotation.set(0,spec.yaw,0)}}
   judge()}
  for(const u of units)if(u.team===1&&u.alive)u.mark.visible=scoutUntil[0]>now;
  const m=Math.max(0,Math.ceil(timeLeft)),al=[0,1].map(k=>units.filter(u=>u.alive&&u.team===k).length);
  $("top").innerHTML=`Round ${round} · You ${isAtk(me)?"attack":"defend"}<br><b>${Math.floor(m/60)}:${String(m%60).padStart(2,"0")}</b><br>${score[0]}–${score[1]} · alive ${al[0]} v ${al[1]}`;
  $("hp").style.width=Math.max(0,me.hp/me.max*100)+"%";$("ab").textContent=me.cd>0?`G: ${me.op.n} ability ready in ${Math.ceil(me.cd)}s`:`G: ${me.op.n} ability ready`}
 for(const u of units)if(!u.alive&&u.g.parent&&!u.isP){u.tm+=dt;u.g.rotation.x=-Math.min(1,u.tm*3)*1.45;u.g.position.y=Math.min(1,u.tm*3)*.18;if(u.tm>9)scene.remove(u.g)}
 for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.t-=dt;p.v.y-=14*dt;p.m.position.addScaledVector(p.v,dt);if(p.m.position.y<.04){p.m.position.y=.04;p.v.multiplyScalar(.4)}if(p.t<=0){scene.remove(p.m);parts.splice(i,1)}}
 if(vm){vmKick=Math.max(0,vmKick-dt*9);vmFlash-=dt;const mv=me&&state==="live"?Math.min(1,Math.hypot(me.vx,me.vz)/4):0;
  vm.position.set(Math.sin(now*7)*.006*mv,Math.abs(Math.cos(now*7))*-.008*mv,vmKick*.06);vm.rotation.x=vmKick*.07;vm.userData.flash.visible=vmFlash>0}
 R.clear();R.render(scene,cam);if(state==="live"&&me&&me.alive&&vm){R.clearDepth();R.render(vmScene,vmCam)}
 requestAnimationFrame(frame)}
buildMap();cam.position.set(0,1.7,24);pickUI("Breach");requestAnimationFrame(frame);
</script>
